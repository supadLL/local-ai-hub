name: Build Release Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      source_archive_url: ${{ steps.version.outputs.source_archive_url }}
      should_release: ${{ steps.version.outputs.should_release }}
      image_name: ${{ steps.version.outputs.image_name }}

    steps:
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          source_archive_url="https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.zip"
          should_release="false"

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            release_version="pr-${GITHUB_SHA:0:12}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release_version="${GITHUB_REF_NAME}"
            source_archive_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.zip"
            should_release="true"
          else
            release_version="${GITHUB_SHA:0:12}"
          fi

          if [ "$should_release" = "true" ] && ! printf '%s\n' "$release_version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release versions must look like v26.1.1.1; got: $release_version" >&2
            exit 1
          fi

          {
            echo "release_version=$release_version"
            echo "source_archive_url=$source_archive_url"
            echo "should_release=$should_release"
            echo "image_name=$image_name"
          } >> "$GITHUB_OUTPUT"

          echo "Release version: $release_version"
          echo "Should release: $should_release"
          echo "Source archive: $source_archive_url"

  windows:
    name: Windows EXE
    runs-on: windows-latest
    needs:
      - version

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Build Windows launcher
        shell: pwsh
        env:
          LAH_BUILD_VERSION: ${{ needs.version.outputs.release_version }}
          LAH_REPO_SLUG: ${{ github.repository }}
          LAH_SOURCE_ARCHIVE_URL: ${{ needs.version.outputs.source_archive_url }}
        run: npm run build:launcher

      - name: Prepare Windows artifacts
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.release_version }}"
          New-Item -ItemType Directory -Force -Path release/windows | Out-Null
          Copy-Item -LiteralPath LocalAIHub.exe -Destination "release/windows/LocalAIHub-$version-win-x64.exe" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalAIHub-Windows
          path: release/windows/*

  linux:
    name: Linux launchers
    runs-on: ubuntu-latest
    needs:
      - version

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Unix launchers
        shell: pwsh
        env:
          LAH_BUILD_VERSION: ${{ needs.version.outputs.release_version }}
          LAH_REPO_SLUG: ${{ github.repository }}
          LAH_SOURCE_ARCHIVE_URL: ${{ needs.version.outputs.source_archive_url }}
        run: ./scripts/build-unix-launchers.ps1

      - name: Package Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.release_version }}"

          chmod +x release/linux/LocalAIHub.sh
          chmod +x release/linux/LocalAIHub.desktop

          for arch in x64 arm64; do
            package_dir="release/linux-${arch}"
            mkdir -p "$package_dir"
            cp -R release/linux/. "$package_dir/"
            tar -czf "release/LocalAIHub-${version}-linux-${arch}.tar.gz" -C "$package_dir" .
          done

          appdir="release/appimage/AppDir"
          mkdir -p "$appdir/usr/bin"
          cp release/linux/LocalAIHub.sh "$appdir/usr/bin/LocalAIHub"
          cp web/src/assets/favicon.svg "$appdir/local-ai-hub.svg"
          cp web/src/assets/favicon.svg "$appdir/.DirIcon"

          cat > "$appdir/local-ai-hub.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Local AI Hub
          Comment=Start Local AI Hub
          Terminal=true
          Exec=LocalAIHub
          Icon=local-ai-hub
          Categories=Development;
          EOF

          cat > "$appdir/AppRun" <<'EOF'
          #!/usr/bin/env sh
          here="$(dirname "$(readlink -f "$0")")"
          exec "$here/usr/bin/LocalAIHub" "$@"
          EOF
          chmod +x "$appdir/AppRun" "$appdir/usr/bin/LocalAIHub"

          curl -L --fail --retry 2 \
            -o release/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x release/appimagetool-x86_64.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 release/appimagetool-x86_64.AppImage \
            "$appdir" "release/LocalAIHub-${version}-linux-x86_64.AppImage"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalAIHub-Linux
          path: |
            release/LocalAIHub-${{ needs.version.outputs.release_version }}-linux-x64.tar.gz
            release/LocalAIHub-${{ needs.version.outputs.release_version }}-linux-arm64.tar.gz
            release/LocalAIHub-${{ needs.version.outputs.release_version }}-linux-x86_64.AppImage

  macos:
    name: macOS launchers
    runs-on: macos-latest
    needs:
      - version

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Unix launchers
        shell: pwsh
        env:
          LAH_BUILD_VERSION: ${{ needs.version.outputs.release_version }}
          LAH_REPO_SLUG: ${{ github.repository }}
          LAH_SOURCE_ARCHIVE_URL: ${{ needs.version.outputs.source_archive_url }}
        run: ./scripts/build-unix-launchers.ps1

      - name: Package macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.release_version }}"
          chmod +x release/macos/LocalAIHub.command

          for arch in x64 arm64; do
            package_dir="release/macos-${arch}"
            mkdir -p "$package_dir"
            cp -R release/macos/. "$package_dir/"
            (cd "$package_dir" && zip -qr "../LocalAIHub-${version}-mac-${arch}.zip" .)
            hdiutil create \
              -volname "Local AI Hub ${version}" \
              -srcfolder "$package_dir" \
              -ov \
              -format UDZO \
              "release/LocalAIHub-${version}-mac-${arch}.dmg"
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalAIHub-macOS
          path: |
            release/LocalAIHub-${{ needs.version.outputs.release_version }}-mac-x64.zip
            release/LocalAIHub-${{ needs.version.outputs.release_version }}-mac-x64.dmg
            release/LocalAIHub-${{ needs.version.outputs.release_version }}-mac-arm64.zip
            release/LocalAIHub-${{ needs.version.outputs.release_version }}-mac-arm64.dmg

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs:
      - version

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail
          image_name="${{ needs.version.outputs.image_name }}"
          version="${{ needs.version.outputs.release_version }}"
          tags=(-t "${image_name}:${GITHUB_SHA}" -t "${image_name}:${version}")

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            tags+=(-t "${image_name}:latest")
          fi

          docker build "${tags[@]}" .

      - name: Save Docker image artifact
        shell: bash
        run: |
          set -euo pipefail
          image_name="${{ needs.version.outputs.image_name }}"
          version="${{ needs.version.outputs.release_version }}"
          mkdir -p release/docker
          docker save "${image_name}:${version}" | gzip > "release/docker/LocalAIHub-${version}-docker-image.tar.gz"

      - name: Push Docker image to GHCR
        if: needs.version.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          image_name="${{ needs.version.outputs.image_name }}"
          version="${{ needs.version.outputs.release_version }}"

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${image_name}:${GITHUB_SHA}"
          docker push "${image_name}:${version}"

          docker tag "${image_name}:${version}" "${image_name}:latest"
          docker push "${image_name}:latest"

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalAIHub-Docker
          path: release/docker/*

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - version
      - windows
      - linux
      - macos
      - docker
    if: needs.version.outputs.should_release == 'true'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Collect release package assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.release_version }}"
          mkdir -p dist-assets

          find release-artifacts -type f -name "LocalAIHub-${version}-*" -print0 | while IFS= read -r -d '' file; do
            cp "$file" "dist-assets/$(basename "$file")"
          done

          if ! find dist-assets -type f | grep -q .; then
            echo "No release package assets were collected." >&2
            exit 1
          fi

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.release_version }}"
          cat > RELEASE_NOTES.md <<EOF
          Local AI Hub ${version}

          Download the artifact for your platform and run it to start Local AI Hub.

          - Windows: LocalAIHub-${version}-win-x64.exe
          - Linux: LocalAIHub-${version}-linux-x86_64.AppImage, or tar.gz packages for x64/arm64
          - macOS: LocalAIHub-${version}-mac-x64.dmg / .zip, or LocalAIHub-${version}-mac-arm64.dmg / .zip
          - Docker: ${{ needs.version.outputs.image_name }}:${version}, or LocalAIHub-${version}-docker-image.tar.gz

          Default local URL: http://127.0.0.1:4100
          EOF

          mapfile -t files < <(find dist-assets -type f | sort)

          if gh release view "$version" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            mapfile -t old_assets < <(
              gh release view "$version" --repo "${GITHUB_REPOSITORY}" --json assets \
                --jq '.assets[].name'
            )
            for asset in "${old_assets[@]}"; do
              if [[ ! "$asset" =~ ^LocalAIHub-${version}- ]]; then
                gh release delete-asset "$version" "$asset" --repo "${GITHUB_REPOSITORY}" -y
              fi
            done
            gh release upload "$version" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "$version" "${files[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Local AI Hub ${version}" \
              --notes-file RELEASE_NOTES.md
          fi
