services:
  local-ai-hub:
    build:
      context: .
    image: local-ai-hub:local
    container_name: local-ai-hub
    environment:
      HOST: 0.0.0.0
      PORT: 4100
      DATA_FILE: /app/data/state.json
      LOG_RETENTION: 200
    ports:
      - "4100:4100"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
